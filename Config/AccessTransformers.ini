; W1.3 cold-review adjudication (2026-07-23): AFGCreature::mIsPassiveCreature /
; mSpawnDistance / mDespawnDistance are PRIVATE (FGCreature.h:659,691,695), so
; self-inheritance cannot reach them. One Friend grant, scoped to writes on OUR
; OWN instances (config Passive mode + per-species spawn/despawn tuning) --
; never used to alter vanilla creatures. Compile-time breakage on a game-update
; field rename is the point (vs a silent runtime no-op from reflection writes).
Friend=(Class="AFGCreature", FriendClass="APFACreatureBase")
; W2.5 (2026-07-24, session-15 evidence): AFGCreatureController::
; GetOrRegisterAggroTarget is PRIVATE (FGCreatureController.h:404) but is the
; ONLY correct way to register an aggro target -- the public SetAggroForTarget
; silently no-ops on unregistered actors (GetAggroForTarget -1.0 sentinel =
; the inert PFA.AggroNearest). Grant scoped to our own controller's dev
; force-aggro + targeting-state hygiene; never used on vanilla controllers.
Friend=(Class="AFGCreatureController", FriendClass="APFACreatureController")
